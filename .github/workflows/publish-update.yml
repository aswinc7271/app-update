name: Publish APK update and website
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-update.yml", "scripts/**", "build-patch/**", "index.html"]
  release:
    types: [published, edited]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: apk-update-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create initial V17 release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v17 >/dev/null 2>&1; then
            python scripts/bootstrap_v17.py
            gh release create v17 MALAYALI-time-fixer-v17.apk --title "MALAYALI time fixer V17" --notes "V17: updater migrated to aswinc7271/app-update; glass UI and floating controls retained. Install once to receive future updates from this repository."
          fi
      - run: pip install androguard==4.1.3
      - name: Read latest APK and generate update feed
        run: python scripts/update_feed.py
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Save generated feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update APK release metadata'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir -p public
          cp index.html update.json public/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish website
        id: deploy
        uses: actions/deploy-pages@v4
